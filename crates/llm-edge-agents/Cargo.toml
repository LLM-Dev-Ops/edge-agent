[package]
name = "llm-edge-agents"
version = "0.1.0"
edition = "2021"
authors = ["LLM Edge Agent Team"]
license = "Apache-2.0"
description = "Edge agents for LLM runtime interception, routing, and execution control"
repository = "https://github.com/globalbusinessadvisors/llm-edge-agent"
keywords = ["llm", "edge", "agents", "runtime", "execution-control"]
categories = ["web-programming"]

[dependencies]
# Local crates
agentics-contracts = { path = "../agentics-contracts" }

# Async runtime
tokio = { version = "1.40", features = ["full", "tracing"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# Observability
tracing = "0.1"
opentelemetry = "0.27"

# Regex for pattern matching
regex = "1.10"

# Parking lot for sync primitives
parking_lot = "0.12"

# HTTP (for Edge Function)
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1.0", features = ["full"] }

# HTTP client (for ruvector-service)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
# Enable Google Cloud Functions compatibility
gcp-functions = []
# Enable local development mode
local = []

[[bin]]
name = "tool-invocation-cli"
path = "src/bin/tool_invocation_cli.rs"

[[bin]]
name = "circuit-breaker-cli"
path = "src/bin/circuit_breaker_cli.rs"

[[bin]]
name = "caching-strategy-cli"
path = "src/bin/caching_strategy_cli.rs"

[[bin]]
name = "llm-edge-agent-unified"
path = "src/bin/unified_service.rs"

[dependencies.tower-http]
version = "0.6"
features = ["trace", "timeout"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "json"]
