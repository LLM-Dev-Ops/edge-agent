# Cloud Build configuration for LLM-Edge-Agent Unified Service
# Deploys to Google Cloud Run in agentics-dev project
#
# Trigger this build:
#   gcloud builds submit --config=deployments/gcp/cloudbuild.yaml .
#
# Or via push to main branch (configure trigger in Cloud Build console)

substitutions:
  _SERVICE_NAME: llm-edge-agent
  _REGION: us-central1
  _PLATFORM_ENV: prod
  _RUVECTOR_SERVICE_URL: https://ruvector-service-HASH-uc.a.run.app
  _TELEMETRY_ENDPOINT: https://observatory-HASH-uc.a.run.app
  _IMAGE_TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ==========================================================================
  # Step 1: Build the Docker image
  # ==========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '-f'
      - 'deployments/gcp/Dockerfile'
      - '.'

  # ==========================================================================
  # Step 2: Push to Container Registry
  # ==========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
    waitFor: ['build']

  # ==========================================================================
  # Step 3: Deploy to Cloud Run
  # ==========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '60s'
      - '--concurrency'
      - '80'
      - '--cpu-throttling'
      - '--set-env-vars'
      - 'PLATFORM_ENV=${_PLATFORM_ENV},SERVICE_NAME=${_SERVICE_NAME},SERVICE_VERSION=${_IMAGE_TAG}'
      - '--set-env-vars'
      - 'RUVECTOR_SERVICE_URL=${_RUVECTOR_SERVICE_URL}'
      - '--set-env-vars'
      - 'TELEMETRY_ENDPOINT=${_TELEMETRY_ENDPOINT}'
      - '--set-env-vars'
      - 'RUST_LOG=llm_edge_agents=info,tower_http=info'
      - '--service-account'
      - 'llm-edge-agent-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--ingress'
      - 'all'
      - '--allow-unauthenticated'
    waitFor: ['push']

  # ==========================================================================
  # Step 4: Verify deployment
  # ==========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Waiting for service to be ready..."
        sleep 10
        DEPLOYED_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        echo "Deployed URL: $$DEPLOYED_URL"
        echo "Deployment complete!"
    waitFor: ['deploy']

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

timeout: 1800s
